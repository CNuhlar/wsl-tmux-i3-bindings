# User configuration for the tmux status bar.
# This file is sourced by Bash, so normal shell syntax is supported.

STATUS_SHOW_HOST=1
STATUS_SHOW_CPU=1
STATUS_SHOW_MEMORY=1
STATUS_SHOW_LOAD=0
STATUS_SHOW_DISK=1
STATUS_SHOW_IP=1
STATUS_SHOW_NETWORK=1
STATUS_SHOW_BATTERY=1

STATUS_DISK_PATH="/"
STATUS_DATE_FORMAT="%a %d %b"
STATUS_TIME_FORMAT="%H:%M:%S"

# Fixed value widths keep the bar from shifting as values change.
STATUS_WIDTH_HOST=0
STATUS_WIDTH_CPU=3
STATUS_WIDTH_MEMORY=3
STATUS_WIDTH_LOAD=5
STATUS_WIDTH_DISK=3
STATUS_WIDTH_IP=0
STATUS_WIDTH_NETWORK=0
STATUS_WIDTH_BATTERY=3
STATUS_WIDTH_DATE=0
STATUS_WIDTH_CUSTOM=0

# Each entry has the form "LABEL::COMMAND". Commands should print one short line.
# Examples:
# CUSTOM_SEGMENTS+=("VPN::ip route | awk '/tun0/ { print \"on\"; exit } END { if (!NR) print \"off\" }'")
# CUSTOM_SEGMENTS+=("DOCKER::docker ps -q 2>/dev/null | wc -l")
# CUSTOM_SEGMENTS+=("TEMP::cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null | awk '{printf \"%.0fC\", $1/1000}'")
CUSTOM_SEGMENTS=()
