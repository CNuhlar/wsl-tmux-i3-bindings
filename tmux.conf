# wsl-tmux-i3 -- i3 inspired, prefix-free navigation for tmux
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-left-length 0
set -g status-right-length 160
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=green'

# i3-style split workflow: choose the direction first, then open a terminal.
# The direction is remembered per window (workspace); horizontal is the
# default for windows that have not chosen one.
set -gw @split_direction h
bind -n M-h set-option -w @split_direction h
bind -n M-v set-option -w @split_direction v
bind -n M-Enter if-shell -F '#{==:#{@split_direction},v}' \
  'split-window -v -c "#{pane_current_path}"' \
  'split-window -h -c "#{pane_current_path}"'

# A tmux window is the closest equivalent to an i3 workspace.
bind -n M-n new-window -c '#{pane_current_path}'

# Focus panes with Alt+j/k/l or Alt+arrow keys. Alt+h selects a horizontal split.
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Enter an i3-like resize mode with Alt+r. In this mode, arrows and
# h/j/k/l resize the active pane; Escape returns to the normal key table.
bind -n M-r switch-client -T resize \; display-message 'Resize mode: arrows or h/j/k/l; Esc to exit'
bind -r -T resize h resize-pane -L 5
bind -r -T resize j resize-pane -D 5
bind -r -T resize k resize-pane -U 5
bind -r -T resize l resize-pane -R 5
bind -r -T resize Left resize-pane -L 5
bind -r -T resize Down resize-pane -D 5
bind -r -T resize Up resize-pane -U 5
bind -r -T resize Right resize-pane -R 5
bind -T resize Escape switch-client -T root \; display-message 'Resize mode ended'
bind -T resize q switch-client -T root \; display-message 'Resize mode ended'

# Direct resize shortcuts remain available as a fallback.
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

bind -n M-f resize-pane -Z
bind -n M-Space next-layout
bind -n M-q display-panes
bind -n M-Q kill-pane

# Alt+1..9 switches to an i3-like workspace, creating it when missing.
bind -n M-1 run-shell 'tmux select-window -t "#{session_name}:1" 2>/dev/null || tmux new-window -t "#{session_name}:1" -c "#{pane_current_path}"'
bind -n M-2 run-shell 'tmux select-window -t "#{session_name}:2" 2>/dev/null || tmux new-window -t "#{session_name}:2" -c "#{pane_current_path}"'
bind -n M-3 run-shell 'tmux select-window -t "#{session_name}:3" 2>/dev/null || tmux new-window -t "#{session_name}:3" -c "#{pane_current_path}"'
bind -n M-4 run-shell 'tmux select-window -t "#{session_name}:4" 2>/dev/null || tmux new-window -t "#{session_name}:4" -c "#{pane_current_path}"'
bind -n M-5 run-shell 'tmux select-window -t "#{session_name}:5" 2>/dev/null || tmux new-window -t "#{session_name}:5" -c "#{pane_current_path}"'
bind -n M-6 run-shell 'tmux select-window -t "#{session_name}:6" 2>/dev/null || tmux new-window -t "#{session_name}:6" -c "#{pane_current_path}"'
bind -n M-7 run-shell 'tmux select-window -t "#{session_name}:7" 2>/dev/null || tmux new-window -t "#{session_name}:7" -c "#{pane_current_path}"'
bind -n M-8 run-shell 'tmux select-window -t "#{session_name}:8" 2>/dev/null || tmux new-window -t "#{session_name}:8" -c "#{pane_current_path}"'
bind -n M-9 run-shell 'tmux select-window -t "#{session_name}:9" 2>/dev/null || tmux new-window -t "#{session_name}:9" -c "#{pane_current_path}"'

# Alt+Shift+1..9 moves the active pane to that workspace, creating it when
# missing; focus stays put, as in i3. The pane is placed using the target
# workspace's own split direction. Alt+Shift+digit reaches tmux as Alt plus
# the US-layout shifted symbol (Windows Terminal is configured to send exactly
# that on every keyboard layout).
bind -n 'M-!' run-shell 'd=$(tmux show-options -wqvA -t "#{session_name}:1" @split_direction 2>/dev/null); tmux join-pane -d -${d:-h} -s "#{pane_id}" -t "#{session_name}:1" 2>/dev/null || tmux break-pane -d -s "#{pane_id}" -t "#{session_name}:1" 2>/dev/null || true'
bind -n 'M-@' run-shell 'd=$(tmux show-options -wqvA -t "#{session_name}:2" @split_direction 2>/dev/null); tmux join-pane -d -${d:-h} -s "#{pane_id}" -t "#{session_name}:2" 2>/dev/null || tmux break-pane -d -s "#{pane_id}" -t "#{session_name}:2" 2>/dev/null || true'
bind -n 'M-#' run-shell 'd=$(tmux show-options -wqvA -t "#{session_name}:3" @split_direction 2>/dev/null); tmux join-pane -d -${d:-h} -s "#{pane_id}" -t "#{session_name}:3" 2>/dev/null || tmux break-pane -d -s "#{pane_id}" -t "#{session_name}:3" 2>/dev/null || true'
bind -n 'M-$' run-shell 'd=$(tmux show-options -wqvA -t "#{session_name}:4" @split_direction 2>/dev/null); tmux join-pane -d -${d:-h} -s "#{pane_id}" -t "#{session_name}:4" 2>/dev/null || tmux break-pane -d -s "#{pane_id}" -t "#{session_name}:4" 2>/dev/null || true'
bind -n 'M-%' run-shell 'd=$(tmux show-options -wqvA -t "#{session_name}:5" @split_direction 2>/dev/null); tmux join-pane -d -${d:-h} -s "#{pane_id}" -t "#{session_name}:5" 2>/dev/null || tmux break-pane -d -s "#{pane_id}" -t "#{session_name}:5" 2>/dev/null || true'
bind -n 'M-^' run-shell 'd=$(tmux show-options -wqvA -t "#{session_name}:6" @split_direction 2>/dev/null); tmux join-pane -d -${d:-h} -s "#{pane_id}" -t "#{session_name}:6" 2>/dev/null || tmux break-pane -d -s "#{pane_id}" -t "#{session_name}:6" 2>/dev/null || true'
bind -n 'M-&' run-shell 'd=$(tmux show-options -wqvA -t "#{session_name}:7" @split_direction 2>/dev/null); tmux join-pane -d -${d:-h} -s "#{pane_id}" -t "#{session_name}:7" 2>/dev/null || tmux break-pane -d -s "#{pane_id}" -t "#{session_name}:7" 2>/dev/null || true'
bind -n 'M-*' run-shell 'd=$(tmux show-options -wqvA -t "#{session_name}:8" @split_direction 2>/dev/null); tmux join-pane -d -${d:-h} -s "#{pane_id}" -t "#{session_name}:8" 2>/dev/null || tmux break-pane -d -s "#{pane_id}" -t "#{session_name}:8" 2>/dev/null || true'
bind -n 'M-(' run-shell 'd=$(tmux show-options -wqvA -t "#{session_name}:9" @split_direction 2>/dev/null); tmux join-pane -d -${d:-h} -s "#{pane_id}" -t "#{session_name}:9" 2>/dev/null || tmux break-pane -d -s "#{pane_id}" -t "#{session_name}:9" 2>/dev/null || true'

# Alt+Shift+arrow moves the active pane in that direction by swapping it with
# its neighbour; focus follows the moved pane. Nothing happens at the edge.
bind -n M-S-Left if-shell -F '#{pane_at_left}' '' 'swap-pane -s "{left-of}"'
bind -n M-S-Down if-shell -F '#{pane_at_bottom}' '' 'swap-pane -s "{down-of}"'
bind -n M-S-Up if-shell -F '#{pane_at_top}' '' 'swap-pane -s "{up-of}"'
bind -n M-S-Right if-shell -F '#{pane_at_right}' '' 'swap-pane -s "{right-of}"'

# Familiar prefix fallbacks and vim-like copy mode.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'clip.exe'

set -g status-style 'bg=colour235,fg=colour250'
set -g status-left ''
set -g status-right '#[reverse,bold]#{?#{==:#{client_key_table},resize}, RESIZE ,}#[default]#(~/.config/wsl-tmux-i3/status.sh) '
setw -g window-status-current-style 'fg=colour235,bg=colour250,bold'
